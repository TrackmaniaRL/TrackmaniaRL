<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1060" viewBox="0 0 1000 1060">
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".14"/></filter></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="37" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#087d74"><tspan x="40" dy="0">TRACKMANIARL / SYSTEM GUIDE / 10</tspan></text>
<path d="M40,52 H960" stroke="#dce3ea" stroke-width="1"/>
<text font-weight="600" x="40" y="91" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="34" fill="#152b43"><tspan x="40" dy="0">Experimental native environment boundary</tspan></text>
<text x="40" y="131" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="40" dy="0">A pinned local runtime supplies checked transitions to an explicit project integration.</tspan></text>
<rect x="40" y="306" width="296" height="306" rx="10" fill="#f3f5f7" stroke="none"/>
<text font-weight="600" x="64" y="344" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="64" dy="0">01 Application project</tspan></text>
<rect x="352" y="306" width="296" height="306" rx="10" fill="#f3f5f7" stroke="none"/>
<text font-weight="600" x="376" y="344" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="376" dy="0">02 Python environment</tspan></text>
<rect x="664" y="306" width="296" height="306" rx="10" fill="#f3f5f7" stroke="none"/>
<text font-weight="600" x="688" y="344" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="688" dy="0">03 External native runtime</tspan></text>
<g data-edge="policy-action">
<polyline points="312,458.0 376,458.0" fill="none" stroke="#087d74" stroke-width="1.75" marker-end="url(#arrow)"/>
</g>
