<path d="M84,381 h32" stroke="#087d74" stroke-width="3"/>
<text font-weight="600" x="84.0" y="439.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="84.0" dy="0">Policy + collector</tspan></text>
<text x="84.0" y="470.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="84.0" dy="0">44 features / 78 actions</tspan><tspan x="84.0" dy="22.5">Terminal-aware replay</tspan></text>
</g>
<g data-node="environment">
<rect x="376" y="380" width="248" height="156" rx="8" fill="#ffffff" stroke="#cdd7e2" stroke-width="1.5"/>
<path d="M396,381 h32" stroke="#285cc4" stroke-width="3"/>
<text font-weight="600" x="396.0" y="427.75" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="396.0" dy="0">Environment facade</tspan></text>
<text x="396.0" y="458.75" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="396.0" dy="0">Reset / step / state /</tspan><tspan x="396.0" dy="22.5">close</tspan><tspan x="396.0" dy="22.5">Receipts + native state</tspan></text>
</g>
<g data-node="driver">
<rect x="688" y="380" width="248" height="156" rx="8" fill="#ffffff" stroke="#cdd7e2" stroke-width="1.5"/>
<path d="M708,381 h32" stroke="#9b681f" stroke-width="3"/>
<text font-weight="600" x="708.0" y="416.5" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="708.0" dy="0">Driver + native child</tspan></text>
<text x="708.0" y="447.5" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="708.0" dy="0">Fork from prepared</tspan><tspan x="708.0" dy="22.5">parent</tspan><tspan x="708.0" dy="22.5">Pinned build + map +</tspan><tspan x="708.0" dy="22.5">shim</tspan></text>
</g>
<g data-node="trace">
<rect x="376" y="688" width="248" height="136" rx="8" fill="#ffffff" stroke="#cdd7e2" stroke-width="1.5"/>
<path d="M396,689 h32" stroke="#285cc4" stroke-width="3"/>
<text font-weight="600" x="396.0" y="725.75" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="396.0" dy="0">Persistent evidence</tspan></text>
<text x="396.0" y="756.75" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="396.0" dy="0">Raw RX + applied</tspan><tspan x="396.0" dy="22.5">inputs</tspan><tspan x="396.0" dy="22.5">Owned state + outcome</tspan></text>
</g>
<g data-note="assets">
<rect x="40" y="174" width="920" height="104" rx="8" fill="#eff4fc" stroke="none" stroke-width="1.5"/>
<text x="60" y="208" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#1f2937"><tspan font-weight="600" x="60" dy="0">EXPLICIT OPT-IN</tspan><tspan x="60" dy="22.5">External assets are hash-checked. Imports and construction do not start native processes.</tspan></text>
</g>
<g data-note="transport">
<rect x="40" y="866" width="448" height="154" rx="8" fill="#fbf5e9" stroke="none" stroke-width="1.5"/>
<text x="60" y="900" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#1f2937"><tspan font-weight="600" x="60" dy="0">TRANSPORT</tspan><tspan x="60" dy="22.5">Local AF_UNIX stream sockets. Explicit runtime</tspan><tspan x="60" dy="22.5">root and deployment; external assets stay</tspan><tspan x="60" dy="22.5">pinned.</tspan></text>
</g>
<g data-note="terminal">
<rect x="512" y="866" width="448" height="154" rx="8" fill="#f3f5f7" stroke="none" stroke-width="1.5"/>
<text x="532" y="900" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#1f2937"><tspan font-weight="600" x="532" dy="0">ENDPOINT CONTRACT</tspan><tspan x="532" dy="22.5">Time-limit final44 can bootstrap. Natural EOF</tspan><tspan x="532" dy="22.5">has no terminal44. Inconclusive evidence</tspan><tspan x="532" dy="22.5">raises.</tspan></text>
</g>
</svg>
